# Free Render Blueprint. Free Postgres expires 30 days after creation.
# Free web services have no disk, so uploaded files disappear when the service sleeps.
services:
  - type: web
    name: school-erp
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: node scripts/render-db.mjs && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString
      - key: ERP_APP_PASSWORD
        generateValue: true
      - key: BODY_SIZE_LIMIT
        value: 6M
      - key: PROTOCOL_HEADER
        value: x-forwarded-proto
      - key: FILE_STORAGE_PATH
        value: /tmp/uploads

databases:
  - name: school-erp-db
    plan: free
    region: singapore
    databaseName: school_erp
